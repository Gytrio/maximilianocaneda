    <script>
      /* Tema antes del primer pintado, para que no se vea un parpadeo del tema equivocado. Sin eleccion
         guardada arranca en claro: el tema del sistema NO se mira, a pedido del usuario, asi el portfolio
         se ve siempre igual en la primera visita. src/hooks/useTheme.js hace la misma cuenta y queda dueno
         del atributo desde que monta. */
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('portfolio-theme');
        } catch (error) {
          stored = null;
        }
        document.documentElement.setAttribute(
          'data-theme',
          stored === 'dark' || stored === 'light' ? stored : 'light'
        );
      })();
    </script>
